{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "turbo-vector.rustfsServiceName" . }}
  labels:
    {{- include "turbo-vector.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  type: ClusterIP
  selector:
    {{- include "turbo-vector.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
  ports:
    - name: s3
      port: {{ .Values.rustfs.service.port }}
      targetPort: s3
      protocol: TCP
    - name: console
      port: {{ .Values.rustfs.service.consolePort }}
      targetPort: console
      protocol: TCP
{{- end }}
