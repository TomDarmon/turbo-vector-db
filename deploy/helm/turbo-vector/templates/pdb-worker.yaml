{{- if gt (int .Values.worker.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "turbo-vector.fullname" . }}-worker
  labels:
    {{- include "turbo-vector.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "turbo-vector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
